<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Orchid Hour</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070b16; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Orchid Hour: cross a moonlit conservatory, avoid keeper cones and glass eyes, steal the Sun Orchid and escape"></canvas>
<p id="status" role="status" aria-live="polite">Move with WASD or arrow keys. Press H for help.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
